[package]
name = "uni-xervo"
version = "0.5.6"
description = "Unified Rust runtime for local and remote embedding, reranking, and generation models"
edition = "2024"
rust-version = "1.88"
authors = ["Dragonscale Industries Inc. <dev@dragonscale.ai>"]
license = "Apache-2.0"
repository = "https://github.com/rustic-ai/uni-xervo"
homepage = "https://www.rustic.ai"
documentation = "https://rustic-ai.github.io/uni-xervo"
readme = "README.md"
keywords = ["machine-learning", "embeddings", "reranking", "inference", "runtime"]
categories = ["api-bindings", "asynchronous"]
include = [
    "/src/**",
    "/benches/**",
    "/examples/**",
    "/tests/**",
    "/schemas/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]

[features]
default = ["provider-candle"]
provider-candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
provider-fastembed = ["dep:fastembed", "dep:ort"]

# ---------------------------------------------------------------------------
# ONNX provider — two mutually-exclusive linking modes.
# See `docs/proposals/gpu-runtime-architecture.md` for the full rationale and
# `docs/migrations/0.5.6-bundled-cpu-default.md` for upgrade guidance.
# ---------------------------------------------------------------------------

# Default mode: bundled CPU. ort statically links pyke's prebuilt CPU
# `libonnxruntime.a` (~91 MB archive → ~70 MB extra in your binary after
# dead-code elimination). Self-contained executable, zero runtime config.
# Build host needs network on first build to fetch the archive from
# pyke's CDN (cached in `~/.cache/ort.pyke.io/`); subsequent builds offline.
provider-onnx = [
    "dep:ort",
    "dep:hf-hub",
    "dep:tokenizers",
    "ort/download-binaries",
    "ort/api-24",
    "fastembed?/ort-download-binaries",
]

# Opt-in mode: load-dynamic. ort compiles to a tiny `dlopen` shim. User
# must supply an ONNX Runtime shared library at deploy time (download
# Microsoft's official tarball matching their hardware and set
# `ORT_DYLIB_PATH`). Required for any GPU EP (CUDA/ROCm/CoreML/DirectML/
# OpenVINO/QNN) — pyke's bundled CPU lib has no GPU EPs.
provider-onnx-dynamic = [
    "dep:ort",
    "dep:hf-hub",
    "dep:tokenizers",
    "dep:libloading",
    "ort/load-dynamic",
    "ort/api-24",
    "fastembed?/ort-load-dynamic",
]
provider-openai = ["dep:reqwest"]
provider-gemini = ["dep:reqwest"]
provider-vertexai = ["dep:reqwest"]
provider-mistral = ["dep:reqwest"]
provider-anthropic = ["dep:reqwest"]
provider-voyageai = ["dep:reqwest"]
provider-cohere = ["dep:reqwest"]
provider-azure-openai = ["dep:reqwest"]
provider-mistralrs = ["dep:mistralrs", "dep:image", "dep:base64"]

# ---------------------------------------------------------------------------
# GPU acceleration features.
#
# All GPU features that touch the ort path imply `provider-onnx-dynamic`
# because pyke's bundled CPU lib (used by `provider-onnx`) has no GPU EPs.
# The candle / mistralrs / fastembed-candle GPU paths bundle their kernels
# (PTX / MSL) into the binary at build time and only need the host driver
# at runtime — they don't depend on the ort linking mode.
#
# See `docs/proposals/gpu-runtime-architecture.md` for build / runtime
# requirements per vendor and the cross-platform support matrix.
# ---------------------------------------------------------------------------

# NVIDIA CUDA — Linux + Windows. Requires nvcc + matching driver +
# CUDA_COMPUTE_CAP at build time (for candle / mistralrs PTX generation).
# See `docs/proposals/onnx-reranker-followups.md` §4 for the PTX-version trap.
gpu-cuda = [
    "provider-onnx-dynamic",
    "ort/cuda",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "fastembed/cuda",
    "mistralrs/cuda",
]

# AMD ROCm via ort. Linux only. EP loaded from ROCm-flavored ORT tarball.
gpu-rocm = ["provider-onnx-dynamic", "ort/rocm"]

# Apple Core ML EP via ort. macOS + iOS. Hits the Neural Engine for
# compatible models. Distinct from `gpu-metal` (Tier-2 candle/mistralrs Metal).
gpu-coreml = ["provider-onnx-dynamic", "ort/coreml"]

# DirectML EP via ort. Windows only, vendor-neutral (NVIDIA/AMD/Intel/Snapdragon).
gpu-directml = ["provider-onnx-dynamic", "ort/directml"]

# Intel OpenVINO EP via ort. Linux + Windows.
gpu-openvino = ["provider-onnx-dynamic", "ort/openvino"]

# Snapdragon X / Qualcomm Hexagon NPU via ort QNN EP. Windows ARM64.
gpu-qnn = ["provider-onnx-dynamic", "ort/qnn"]

# Apple Metal — macOS + iOS only. Activates candle / fastembed-candle /
# mistralrs Metal kernels. Doesn't touch the ort path. build.rs panics on
# non-Apple targets.
gpu-metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "fastembed/metal",
    "mistralrs/metal",
]

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
metrics = "0.24"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
indexmap = "2.14"
ndarray = "0.17"

# Optional dependencies for providers
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig", "http"], optional = true }
hf-hub = { version = "0.5", features = ["tokio"], optional = true }
# fastembed's ort linking mode is controlled via uni-xervo's `provider-onnx`
# (download-binaries) or `provider-onnx-dynamic` (load-dynamic) features
# using `fastembed?/ort-...` conditional activation in those feature lists.
fastembed = { version = "5.13", default-features = false, features = ["hf-hub-native-tls"], optional = true }
reqwest = { version = "0.13", features = ["json", "rustls"], optional = true }
mistralrs = { version = "0.8", default-features = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
base64 = { version = "0.22", optional = true }
dashmap = "6.1"
# ort linking mode (download-binaries vs load-dynamic) is selected by
# uni-xervo's `provider-onnx` or `provider-onnx-dynamic` feature; the dep
# declares only the minimal default-feature-free baseline plus the always-on
# bits (tls-native for the build-time download path, ndarray for tensor
# interop, std).
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["tls-native", "ndarray", "std"] }
# Used by `provider::onnx_ep::preflight_ort_dylib` (only present under
# `provider-onnx-dynamic`) to detect missing/unloadable ONNX Runtime libs
# before the broken error path in ort 2.0.0-rc.12 deadlocks on its own
# OnceLock (pykeio/ort#560, fixed upstream in 17ed7277 but not yet released).
libloading = { version = "0.8", optional = true }

[dev-dependencies]
anyhow = "1.0"
criterion = { version = "0.8", features = ["async_tokio"] }
metrics-util = "0.20"
reqwest = { version = "0.13", features = ["rustls"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[[bench]]
name = "runtime_bench"
harness = false
