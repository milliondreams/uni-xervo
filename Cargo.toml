[package]
name = "uni-xervo"
version = "0.6.0"
description = "Unified Rust runtime for local and remote embedding, reranking, and generation models"
edition = "2024"
rust-version = "1.88"
authors = ["Dragonscale Industries Inc. <dev@dragonscale.ai>"]
license = "Apache-2.0"
repository = "https://github.com/rustic-ai/uni-xervo"
homepage = "https://www.rustic.ai"
documentation = "https://rustic-ai.github.io/uni-xervo"
readme = "README.md"
keywords = ["machine-learning", "embeddings", "reranking", "inference", "runtime"]
categories = ["api-bindings", "asynchronous"]
include = [
    "/src/**",
    "/benches/**",
    "/examples/**",
    "/tests/**",
    "/schemas/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]

[features]
default = ["provider-candle"]
provider-candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
provider-fastembed = ["dep:fastembed", "dep:ort"]

# ─── ONNX provider — three mutually-exclusive deployment modes ───────────────
# See `docs/proposals/gpu-runtime-architecture.md` for the full design and
# `docs/migrations/0.6.0-bundled-everywhere.md` for upgrade guidance.
#
# Mode A — `provider-onnx`: pyke's prebuilt CPU bundle, statically linked.
#   Self-contained binary (~70 MB extra), zero runtime configuration.
#
# Mode B — `gpu-cuda` / `gpu-tensorrt`: pyke's CUDA-flavored bundle (static
#   `libonnxruntime.a` + sidecar EP `.so` files, copied into target/<profile>/
#   automatically by ort/copy-dylibs). Self-contained-ish artifact, zero
#   runtime configuration. CUDA driver is the host's responsibility.
#
# Mode C — `gpu-rocm` / `gpu-coreml` / `gpu-directml` / `gpu-openvino` /
#   `gpu-qnn`: Microsoft's prebuilt tarball, fetched + staged at build time
#   by uni-xervo's build.rs (Microsoft is the only source of these). Result
#   is the same shape as Mode B — binary plus sidecar `.so`/`.dylib`/`.dll`
#   in target/<profile>/.
#
# Mode D — `provider-onnx-dynamic`: power-user escape. No build-time fetch.
#   User provides an ONNX Runtime shared library at deploy time and sets
#   `ORT_DYLIB_PATH`. For sandboxed CIs that can't reach the network at
#   build time, custom ORT builds, pinned non-default versions, etc.
# ────────────────────────────────────────────────────────────────────────────

# Mode A: bundled CPU (pyke `download-binaries`).
provider-onnx = [
    "dep:ort",
    "dep:hf-hub",
    "dep:tokenizers",
    "ort/download-binaries",
    "ort/copy-dylibs",
    "ort/api-24",
    "fastembed?/ort-download-binaries",
]

# Mode D: load-dynamic, BYO tarball.
provider-onnx-dynamic = [
    "dep:ort",
    "dep:hf-hub",
    "dep:tokenizers",
    "dep:libloading",
    "ort/load-dynamic",
    "ort/api-24",
    "fastembed?/ort-load-dynamic",
]

# Internal scaffolding for Mode C — not user-facing. Activated by the
# Microsoft-fetched gpu-* features below. Combining it with `provider-onnx`
# (Mode A/B) is mutually exclusive at the ort layer; build.rs enforces.
_ort-fetched-base = [
    "dep:ort",
    "dep:hf-hub",
    "dep:tokenizers",
    "dep:libloading",
    "ort/load-dynamic",
    "ort/api-24",
    "fastembed?/ort-load-dynamic",
]

provider-openai = ["dep:reqwest"]
provider-gemini = ["dep:reqwest"]
provider-vertexai = ["dep:reqwest"]
provider-mistral = ["dep:reqwest"]
provider-anthropic = ["dep:reqwest"]
provider-voyageai = ["dep:reqwest"]
provider-cohere = ["dep:reqwest"]
provider-azure-openai = ["dep:reqwest"]
provider-mistralrs = ["dep:mistralrs", "dep:image", "dep:base64"]

# ─── GPU acceleration ────────────────────────────────────────────────────────
# Every gpu-* feature produces a self-contained build artifact:
# `cargo build --features gpu-X` pulls the right ONNX Runtime + EP libraries,
# links them, and stages sidecar dylibs into target/<profile>/ via
# ort/copy-dylibs ($ORIGIN rpath). No `ORT_DYLIB_PATH` setup at runtime.
#
# Source-of-binaries reality (verified against pyke `dist.txt` and Microsoft
# `microsoft/onnxruntime` releases):
#
# - Pyke ships CUDA, TensorRT, WGPU, and the CoreML-bearing macOS bundle.
#   `cargo build` pulls these via ort-sys's `download-binaries` pipeline +
#   ort/copy-dylibs.
#
# - Microsoft ships DirectML (in the Windows GPU tarball) and CUDA tarballs.
#   For DirectML we use our own fetcher (`build/ort_vendor.rs`) since pyke
#   doesn't ship a DirectML-flavored bundle.
#
# - ROCm and OpenVINO are NOT distributed by either pyke or Microsoft as
#   prebuilt tarballs. Users targeting these need `provider-onnx-dynamic`
#   plus a vendor-supplied ORT build (AMD's onnxruntime-rocm package or
#   Intel's openvino-onnxruntime package). build.rs emits a clear error
#   pointing at the migration doc.
#
# Mutually exclusive: build.rs panics if you combine GPU features that imply
# different ort linking modes (e.g. gpu-cuda + gpu-directml).

# ─── Pyke-bundled (Mode B) ──────────────────────────────────────────────────

# NVIDIA CUDA — Linux + Windows. Pyke fetches the CUDA-flavored bundle
# (libonnxruntime.a + libonnxruntime_providers_cuda.so + sidecars).
# ort/copy-dylibs stages the .so files into target/<profile>/ with $ORIGIN rpath.
# Build host needs nvcc + CUDA_COMPUTE_CAP for candle/mistralrs PTX generation.
gpu-cuda = [
    "provider-onnx",
    "ort/cuda",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "fastembed/cuda",
    "mistralrs/cuda",
]

# NVIDIA TensorRT-RTX — pyke ships a TensorRT-RTX bundle (`nvrtx`).
# Linux + Windows. NVIDIA only.
gpu-tensorrt = [
    "provider-onnx",
    "ort/nvrtx",
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "fastembed/cuda",
    "mistralrs/cuda",
]

# Apple Core ML — Apple targets. Pyke's macOS prebuilt includes the CoreML EP
# in the ORT main lib (the `none` bundle for aarch64-apple-darwin). Hits the
# Neural Engine for compatible models. Distinct from `gpu-metal` (Tier-2
# candle/mistralrs Metal kernels, also Apple-only).
gpu-coreml = ["provider-onnx", "ort/coreml"]

# Vendor-neutral GPU via WebGPU — Linux + Windows. Pyke ships a WGPU bundle
# that works on any modern GPU (NVIDIA / AMD / Intel) on the same OS. Lower
# perf than vendor-native EPs but a single binary covers any GPU vendor.
gpu-wgpu = ["provider-onnx", "ort/webgpu"]

# ─── Microsoft-fetched (Mode C) ──────────────────────────────────────────────

# DirectML — Windows only, vendor-neutral on Windows
# (NVIDIA / AMD / Intel / Snapdragon Adreno). build.rs downloads Microsoft's
# `onnxruntime-win-x64-gpu-*.zip` (which contains the DirectML provider DLLs)
# and stages them into target/<profile>/.
gpu-directml = ["_ort-fetched-base", "ort/directml"]

# Snapdragon X / Qualcomm Hexagon NPU — Windows ARM64. build.rs downloads
# Microsoft's ARM64x prebuilt. (Verify availability per ORT release.)
gpu-qnn = ["_ort-fetched-base", "ort/qnn"]

# ─── User-supplied tarball required (Mode D) ────────────────────────────────
# These vendors do NOT ship prebuilt ORT tarballs through pyke or Microsoft's
# main distribution channel. AMD has its own `onnxruntime-rocm` package; Intel
# has `openvino-onnxruntime`. Users must opt into `provider-onnx-dynamic` and
# point `ORT_DYLIB_PATH` at the vendor-supplied build.
#
# We expose the cargo features so that an `ort/rocm` / `ort/openvino` EP type
# is compiled in when the user enables them, but build.rs panics with a clear
# message if combined with anything else (forcing the user to also enable
# `provider-onnx-dynamic`). Activating these alone implies dynamic.
gpu-rocm = ["_ort-fetched-base", "ort/rocm"]
gpu-openvino = ["_ort-fetched-base", "ort/openvino"]

# Apple Metal — orthogonal to the ort path. Activates candle / fastembed-
# candle / mistralrs Metal kernels (compiled to .metallib at build, embedded
# in the binary). Runtime requirement: macOS Metal framework (part of OS).
# build.rs panics on non-Apple targets.
gpu-metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "fastembed/metal",
    "mistralrs/metal",
]

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
metrics = "0.24"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
indexmap = "2.14"
ndarray = "0.17"

# Optional dependencies for providers
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig", "http"], optional = true }
hf-hub = { version = "0.5", features = ["tokio"], optional = true }
# fastembed's ort linking mode is controlled via uni-xervo's `provider-onnx`
# (download-binaries) or `provider-onnx-dynamic` (load-dynamic) features
# using `fastembed?/ort-...` conditional activation in those feature lists.
fastembed = { version = "5.13", default-features = false, features = ["hf-hub-native-tls"], optional = true }
reqwest = { version = "0.13", features = ["json", "rustls"], optional = true }
mistralrs = { version = "0.8", default-features = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
base64 = { version = "0.22", optional = true }
dashmap = "6.1"
# ort linking mode (download-binaries vs load-dynamic) is selected by
# uni-xervo's `provider-onnx` or `provider-onnx-dynamic` feature; the dep
# declares only the minimal default-feature-free baseline plus the always-on
# bits (tls-native for the build-time download path, ndarray for tensor
# interop, std).
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["tls-native", "ndarray", "std"] }
# Used by `provider::onnx_ep::preflight_ort_dylib` (only present under
# `provider-onnx-dynamic`) to detect missing/unloadable ONNX Runtime libs
# before the broken error path in ort 2.0.0-rc.12 deadlocks on its own
# OnceLock (pykeio/ort#560, fixed upstream in 17ed7277 but not yet released).
libloading = { version = "0.8", optional = true }

[build-dependencies]
# Build-script deps used by `build/ort_vendor.rs` to fetch + extract +
# verify Microsoft's prebuilt ONNX Runtime tarballs at build time.
# Only pulled in when one of the Microsoft-fetched gpu-* features is active;
# the build.rs is a no-op otherwise.
ureq = { version = "2.12", features = ["tls", "native-tls"], default-features = false }
flate2 = "1"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
anyhow = "1.0"
criterion = { version = "0.8", features = ["async_tokio"] }
metrics-util = "0.20"
reqwest = { version = "0.13", features = ["rustls"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[[bench]]
name = "runtime_bench"
harness = false
